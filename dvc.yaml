stages:
  prepare_train:
    cmd: python -m src.data.make_dataset
    deps:
      - data/raw
      - data/splits
      - src/data/make_dataset.py
      - src/data/preprocessing.py
      - src/data/splits.py
    outs:
      - data/processed/train.pt
      - data/processed/validation.pt
      - data/processed/test.pt

  hyperopt:
    cmd: python -m src.training.hyperopt_search --max-evals ${hyperopt.max_evals} --epochs ${hyperopt.epochs}
    deps:
      - data/processed/train.pt
      - data/processed/validation.pt
      - data/splits
      - src/training/hyperopt_search.py
      - src/training/train.py
      - src/models/architecture.py
      - src/training/loops.py
    outs:
      - src/training/hyperopt_params.json

  train:
    cmd: python -m src.training.train --epochs ${train.epochs} --batch-size ${train.batch_size} --hyperopt-params src/training/hyperopt_params.json
    deps:
      - data/processed/train.pt
      - data/processed/validation.pt
      - data/splits
      - src/training/train.py
      - src/training/hyperopt_params.json
      - src/models/architecture.py
      - src/training/loops.py
    outs:
      - models/best_model.pth
      - metrics/training_curves.png
    metrics:
      - metrics/train_metrics.json:
          cache: false

  inference_batches:
    cmd: python -m src.inference.batch_inference
    deps:
      - models/best_model.pth
      - data/raw
      - src/inference/batch_inference.py
      - data/annotations/mapped_train.csv
    outs:
      - outputs/:
          cache: false

# Final test is a separate, manual action:
# python -m src.training.evaluate
