[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops_face_attribute_classification"
version = "0.2.0"
description = "Reproducible multi-attribute image classification"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3", "pandas>=2.1,<3", "torch>=2.6,<3",
    "opencv-python-headless>=4.8,<5", "scikit-learn>=1.4,<2",
    "matplotlib>=3.8,<4", "tqdm>=4.66,<5", "PyYAML>=6,<7",
]

[project.optional-dependencies]
train = ["mlflow>=2.17,<4", "hyperopt==0.2.7", "setuptools<81"]
pipeline = ["dvc>=3.50,<4"]
test = ["pytest>=8,<9", "pytest-cov>=5,<7", "flake8>=7,<8", "build>=1.2,<2", "hyperopt==0.2.7", "setuptools<81"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]
