name: CI Pipeline

on:
  push:
    branches: [master, development, devlopment]
  pull_request:
    branches: [master, development, devlopment]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Clean install and tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU PyTorch and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[test]'
          python -m pip check
      - name: Reject syntax errors and undefined names
        run: python -m flake8 src tests --select=E9,F63,F7,F82 --show-source --statistics
      - name: Build and install the wheel
        run: |
          python -m build --wheel
          python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Test the installed package outside the checkout
        run: |
          cd "${RUNNER_TEMP}"
          python -I -m pytest "${GITHUB_WORKSPACE}/tests" -c "${GITHUB_WORKSPACE}/pyproject.toml" --cov=src --cov-report=term-missing --cov-report=xml:"${GITHUB_WORKSPACE}/coverage.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-python-${{ matrix.python }}
          path: coverage.xml
