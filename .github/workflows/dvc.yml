name: DVC Pipeline Validation

on:
  push:
    branches: [master, development, devlopment]
    paths: ['dvc.yaml', 'params.yaml', '.github/workflows/dvc.yml']
  pull_request:
    branches: [master, development, devlopment]
    paths: ['dvc.yaml', 'params.yaml', '.github/workflows/dvc.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-dvc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'dvc>=3.50,<4' 'PyYAML>=6,<7'
      - name: Validate the graph without accessing image data
        run: |
          dvc init
          dvc dag --md
          dvc stage list
          python -c "import yaml; p=yaml.safe_load(open('dvc.yaml')); assert 'evaluate' not in p['stages'], 'Reserved test must stay out of automatic retraining'"
